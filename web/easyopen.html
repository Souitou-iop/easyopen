<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0f12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="EasyOpen 本地 BLE 开门器控制" />
  <title>EasyOpen | 本地蓝牙控制</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/easyopen-app-icon.svg" />
  <link rel="alternate icon" type="image/png" href="./icons/icon-192.png" />
  <style>
:root {
  color-scheme: dark;
  --background: #0c0f12;
  --background-raised: #11161b;
  --surface: #151b21;
  --surface-strong: #1a222a;
  --surface-soft: #202932;
  --text: #edf2f5;
  --muted: #96a2ad;
  --muted-strong: #b7c1c9;
  --outline: #2b3640;
  --outline-strong: #3a4855;
  --accent: #78b8f6;
  --accent-strong: #a5d1ff;
  --accent-ink: #07111b;
  --danger: #ff9b91;
  --success: #8dd9b0;
  --shadow: rgba(0, 0, 0, .28);
  --radius: 18px;
  --display: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-family: var(--display);
}

@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --background: #f0f3f5;
    --background-raised: #f7f9fa;
    --surface: #ffffff;
    --surface-strong: #f7fafc;
    --surface-soft: #e9eff3;
    --text: #14202a;
    --muted: #5e6c76;
    --muted-strong: #3d4a53;
    --outline: #d5dfe6;
    --outline-strong: #bbc9d3;
    --accent: #176da9;
    --accent-strong: #11547f;
    --accent-ink: #f7fbff;
    --danger: #a63d35;
    --success: #20774e;
    --shadow: rgba(21, 42, 56, .12);
  }
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--background); }
body { min-width: 320px; margin: 0; background: var(--background); color: var(--text); }
body, button, input, select { font-family: var(--display); }
button, input, select { font-size: inherit; }
button { border: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .48; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.page-noise { position: fixed; inset: 0; z-index: 10; pointer-events: none; opacity: .035; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E"); }
.page-shell { position: relative; z-index: 1; width: min(1180px, 100%); margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom)); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 68px; border-bottom: 1px solid var(--outline); }
.brand-block { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand-lockup { display: inline-flex; align-items: center; gap: 10px; color: var(--text); font-size: 17px; font-weight: 780; letter-spacing: -.035em; text-decoration: none; }
.brand-lockup img { display: block; width: 32px; height: 32px; border-radius: 10px; }
.brand-meta { padding-left: 16px; border-left: 1px solid var(--outline); color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: .14em; }
.status-pill, .local-only { display: inline-flex; align-items: center; min-height: 29px; padding: 5px 10px; border: 1px solid var(--outline); border-radius: 999px; background: var(--surface); color: var(--muted-strong); font-family: var(--mono); font-size: 10px; letter-spacing: .05em; white-space: nowrap; }
.status-pill[data-status="ok"] { border-color: color-mix(in srgb, var(--success) 45%, var(--outline)); color: var(--success) !important; }
.status-pill[data-status="error"] { border-color: color-mix(in srgb, var(--danger) 50%, var(--outline)); color: var(--danger) !important; }

.content-grid { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(380px, .92fr); gap: 18px; padding-top: 24px; }
.hero-card { position: relative; display: grid; min-height: 688px; overflow: hidden; padding: 34px; border: 1px solid #2f414e; border-radius: var(--radius); background: var(--surface); box-shadow: 0 26px 70px var(--shadow); }
.hero-card::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(145deg, rgba(120, 184, 246, .12), transparent 38%); }
.hero-copy, .hero-control { position: relative; z-index: 1; }
.hero-copy { align-self: start; max-width: 460px; }
.eyebrow, .section-label { margin: 0 0 9px; color: var(--accent); font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
h1, h2, p { margin-top: 0; }
h1 { max-width: 12ch; margin-bottom: 15px; font-size: clamp(46px, 6vw, 78px); font-weight: 720; letter-spacing: -.085em; line-height: .95; }
h2 { margin-bottom: 0; font-size: 21px; font-weight: 700; letter-spacing: -.045em; }
.hero-copy p:not(.eyebrow) { max-width: 30ch; margin-bottom: 0; color: var(--muted-strong); font-size: 15px; line-height: 1.55; }
.hero-media { position: absolute; right: 0; bottom: 0; left: 0; height: 48%; overflow: hidden; border-top: 1px solid rgba(255, 255, 255, .1); background: #18212a; }
.hero-media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12, 15, 18, .08), rgba(12, 15, 18, .72)); }
.hero-media img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 58%; filter: saturate(.75) contrast(1.05) brightness(.72); }
.hero-control { align-self: end; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
.unlock-button { display: grid; place-items: center; width: 174px; min-height: 174px; padding: 24px; border: 1px solid rgba(165, 209, 255, .42); border-radius: 50%; background: var(--accent); color: var(--accent-ink); box-shadow: 0 16px 36px rgba(43, 112, 177, .23), inset 0 1px 0 rgba(255, 255, 255, .55); transition: transform .22s cubic-bezier(.16, 1, .3, 1), box-shadow .22s ease, background .22s ease; }
.unlock-button:not(:disabled):hover { transform: translateY(-4px); box-shadow: 0 23px 46px rgba(43, 112, 177, .33), inset 0 1px 0 rgba(255, 255, 255, .6); }
.unlock-button:not(:disabled):active { transform: translateY(-1px) scale(.98); }
.unlock-button:disabled { background: var(--surface-soft); border-color: var(--outline-strong); color: var(--muted); box-shadow: none; }
#unlock-label { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.06em; }
.unlock-subtitle { display: block; margin-top: 3px; font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
.state-text { align-self: center; max-width: 180px; margin: 0 0 10px; color: var(--muted); font-family: var(--mono); font-size: 11px; line-height: 1.45; }

.side-column { display: grid; align-content: start; gap: 18px; }
.card { padding: 22px; border: 1px solid var(--outline); border-radius: var(--radius); background: var(--surface); box-shadow: 0 12px 30px var(--shadow); }
.card-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
.card-heading.compact { margin-bottom: 18px; }
.muted, .hint { color: var(--muted); }
.muted { max-width: 34ch; margin: 7px 0 0; font-family: var(--mono); font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
.connection-status { display: inline-flex; align-items: center; gap: 9px; padding-top: 4px; color: var(--muted); font-family: var(--mono); font-size: 10px; white-space: nowrap; }
.connection-dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: var(--outline-strong); box-shadow: 0 0 0 4px color-mix(in srgb, var(--outline) 60%, transparent); }
.connection-dot.connected { background: var(--success); box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 18%, transparent); }
.button-row { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 10px; }
.primary-button, .secondary-button { min-height: 49px; padding: 0 16px; border-radius: 12px; font-size: 13px; font-weight: 750; transition: transform .18s ease, background .18s ease, border-color .18s ease; }
.primary-button { background: var(--accent); color: var(--accent-ink); }
.primary-button:not(:disabled):hover { background: var(--accent-strong); transform: translateY(-2px); }
.primary-button:not(:disabled):active, .secondary-button:not(:disabled):active { transform: translateY(1px) scale(.985); }
.secondary-button { border: 1px solid var(--outline-strong); background: transparent; color: var(--text); }
.secondary-button:not(:disabled):hover { border-color: var(--accent); color: var(--accent-strong); background: color-mix(in srgb, var(--accent) 10%, transparent); transform: translateY(-2px); }

.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
label { display: grid; gap: 7px; color: var(--muted-strong); font-family: var(--mono); font-size: 10px; line-height: 1.2; }
input, select { width: 100%; min-height: 45px; padding: 0 12px; border: 1px solid var(--outline); border-radius: 10px; outline: none; background: var(--surface-strong); color: var(--text); font-family: var(--display); font-size: 14px; transition: border-color .18s ease, box-shadow .18s ease, background .18s ease; }
input::placeholder { color: var(--muted); }
input:hover, select:hover { border-color: var(--outline-strong); }
input:focus, select:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.hint { margin: 18px 0 0; padding-top: 15px; border-top: 1px solid var(--outline); font-size: 11px; line-height: 1.55; }
.compatibility-card ul { display: grid; gap: 0; margin: 0 0 18px; padding: 0; list-style: none; }
.compatibility-card li { padding: 12px 0; border-top: 1px solid var(--outline); color: var(--muted-strong); font-size: 12px; line-height: 1.55; }
.compatibility-card li:last-child { border-bottom: 1px solid var(--outline); }
details { padding-top: 2px; }
summary { color: var(--accent-strong); cursor: pointer; font-family: var(--mono); font-size: 10px; letter-spacing: .03em; }
pre { max-height: 220px; overflow: auto; margin: 12px 0 0; padding: 13px; border: 1px solid var(--outline); border-radius: 11px; background: var(--background-raised); color: var(--muted-strong); font-family: var(--mono); font-size: 10px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.page-footer { display: flex; justify-content: space-between; gap: 16px; padding: 18px 3px 0; color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: .02em; }
.toast { position: fixed; right: 22px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 20; max-width: min(420px, calc(100vw - 44px)); padding: 13px 15px; border: 1px solid var(--outline-strong); border-radius: 12px; background: var(--surface-strong); color: var(--text); box-shadow: 0 18px 40px var(--shadow); font-size: 12px; line-height: 1.45; opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity .2s ease, transform .2s ease; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.error { border-color: color-mix(in srgb, var(--danger) 55%, var(--outline)); color: var(--danger); }

@media (prefers-reduced-motion: no-preference) {
  .topbar, .hero-card, .device-card, .settings-card, .compatibility-card, .page-footer { animation: rise-in .55s cubic-bezier(.16, 1, .3, 1) both; }
  .hero-card { animation-delay: .04s; }
  .device-card { animation-delay: .1s; }
  .settings-card { animation-delay: .16s; }
  .compatibility-card { animation-delay: .22s; }
  .page-footer { animation-delay: .28s; }
  .hero-media img { transition: transform .8s cubic-bezier(.16, 1, .3, 1), filter .3s ease; }
  .hero-card:hover .hero-media img { transform: scale(1.035); filter: saturate(.9) contrast(1.05) brightness(.8); }
  .connection-dot.connected { animation: status-pulse 2.4s ease-in-out infinite; }
}
@keyframes rise-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes status-pulse { 0%, 100% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 18%, transparent); } 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--success) 4%, transparent); } }

@media (max-width: 900px) {
  .content-grid { grid-template-columns: 1fr; }
  .hero-card { min-height: 620px; }
  .side-column { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .compatibility-card { grid-column: 1 / -1; }
}
@media (max-width: 680px) {
  .page-shell { padding-right: 16px; padding-left: 16px; }
  .topbar { align-items: flex-start; min-height: 62px; padding: 6px 0 16px; }
  .brand-block { align-items: flex-start; gap: 10px; }
  .brand-meta { display: none; }
  .status-pill { max-width: 132px; overflow: hidden; text-overflow: ellipsis; }
  .content-grid { gap: 14px; padding-top: 14px; }
  .hero-card { min-height: 590px; padding: 24px; }
  h1 { font-size: clamp(46px, 15vw, 66px); }
  .hero-media { height: 45%; }
  .hero-control { align-items: flex-end; }
  .unlock-button { width: 144px; min-height: 144px; }
  .side-column { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .compatibility-card { grid-column: auto; }
  .card { padding: 18px; }
}
@media (max-width: 420px) {
  .hero-card { min-height: 560px; padding: 20px; }
  .hero-control { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
  .unlock-button { width: 132px; min-height: 132px; }
  .state-text { max-width: none; margin-bottom: 8px; }
  .button-row { grid-template-columns: 1fr; }
  .field-grid { grid-template-columns: 1fr; }
  .page-footer { display: grid; gap: 5px; }
}

  </style>
</head>

  <script>
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const WRITE_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const NOTIFY_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

const $ = (id) => document.getElementById(id);
const els = {
  secureBadge: $("secure-badge"),
  heroTitle: $("hero-title"),
  heroSubtitle: $("hero-subtitle"),
  unlockButton: $("unlock-button"),
  unlockLabel: $("unlock-label"),
  stateText: $("state-text"),
  selectButton: $("select-button"),
  reconnectButton: $("reconnect-button"),
  deviceName: $("device-name"),
  deviceId: $("device-id"),
  connectionDot: $("connection-dot"),
  password: $("password"),
  attribute: $("attribute"),
  openTime: $("open-time"),
  waitTime: $("wait-time"),
  closeTime: $("close-time"),
  diagnostic: $("diagnostic-output"),
  toast: $("toast"),
};

let device = null;
let server = null;
let writeCharacteristic = null;
let notifyCharacteristic = null;
let state = "idle";
let toastTimer = null;

function setState(next, message = "") {
  state = next;
  document.body.dataset.state = next;
  const connected = next === "ready" || next === "unlocking" || next === "success";
  els.connectionDot.classList.toggle("connected", connected);
  els.unlockButton.disabled = next !== "ready" || !els.password.value.trim();
  els.reconnectButton.disabled = !device || next === "connecting" || next === "unlocking";
  els.unlockLabel.textContent = next === "unlocking" ? "处理中" : "开门";
  els.stateText.textContent = message || ({
    idle: "尚未连接",
    connecting: "正在连接…",
    ready: "蓝牙已就绪",
    unlocking: "正在发送安全指令…",
    success: "开门成功",
    error: "操作失败",
  }[next] || next);
}

function notify(message, isError = false) {
  els.toast.textContent = message;
  els.toast.classList.toggle("error", isError);
  els.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove("show"), 3200);
}

function updateEnvironment() {
  const supported = "bluetooth" in navigator;
  const secure = window.isSecureContext;
  const isAndroid = /Android/i.test(navigator.userAgent);
  const isDesktopLinux = /Linux/i.test(navigator.userAgent) && !isAndroid;
  let guidance = "";

  if (supported && secure) {
    els.secureBadge.textContent = "环境可用";
    els.secureBadge.dataset.status = "ok";
    els.secureBadge.style.color = "";
    guidance = "Web Bluetooth 已暴露，可以点击选择设备。";
  } else if (!secure) {
    els.secureBadge.textContent = "需要 HTTPS";
    els.secureBadge.dataset.status = "error";
    els.secureBadge.style.color = "";
    guidance = "请通过 HTTPS 打开；开发时使用 localhost。";
  } else {
    els.secureBadge.textContent = "未启用 Web Bluetooth";
    els.secureBadge.dataset.status = "error";
    els.secureBadge.style.color = "";
    guidance = isDesktopLinux
      ? "Linux Chrome 需要打开 chrome://flags/#experimental-web-platform-features 并重启浏览器。"
      : "请改用支持 Web Bluetooth 的 Chromium/Android Chrome。";
  }

  // Keep this button clickable so an unsupported environment explains itself
  // instead of looking like a dead control.
  els.selectButton.disabled = false;
  els.diagnostic.textContent = [
    `页面: ${window.location.href}`,
    `安全上下文: ${secure ? "是" : "否"}`,
    `navigator.bluetooth: ${supported ? "可用" : "不可用"}`,
    `平台: ${navigator.userAgent}`,
    guidance,
  ].join("\n");

  if (!supported || !secure) {
    els.heroTitle.textContent = !secure ? "请使用 HTTPS 打开" : "先启用浏览器蓝牙能力";
    els.heroSubtitle.textContent = guidance;
  }
}

function profileFromForm() {
  return {
    password: els.password.value,
    attribute: Number(els.attribute.value),
    openTime: clampNumber(els.openTime.value, 650),
    waitTime: clampNumber(els.waitTime.value, 2000),
    closeTime: clampNumber(els.closeTime.value, 600),
  };
}

function clampNumber(value, fallback) {
  const number = Number.parseInt(value, 10);
  return Number.isFinite(number) ? Math.max(0, Math.min(60000, number)) : fallback;
}

function isHex(value, length) {
  return new RegExp(`^[0-9a-fA-F]{${length}}$`).test(value);
}

async function md5Hex(value) {
  // The browser's built-in digest API supports SHA-*, not MD5. This compact
  // implementation is used only to reproduce the legacy opener protocol.
  const bytes = new TextEncoder().encode(value);
  const bitLength = bytes.length * 8;
  const paddedLength = (((bytes.length + 8) >> 6) + 1) * 64;
  const data = new Uint8Array(paddedLength);
  data.set(bytes);
  data[bytes.length] = 0x80;
  const view = new DataView(data.buffer);
  view.setUint32(paddedLength - 8, bitLength >>> 0, true);
  view.setUint32(paddedLength - 4, Math.floor(bitLength / 0x100000000), true);

  let a0 = 0x67452301;
  let b0 = 0xefcdab89;
  let c0 = 0x98badcfe;
  let d0 = 0x10325476;
  const shifts = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21];
  const constants = Array.from({ length: 64 }, (_, i) => Math.floor(Math.abs(Math.sin(i + 1)) * 0x100000000) >>> 0);
  const leftRotate = (x, amount) => ((x << amount) | (x >>> (32 - amount))) >>> 0;

  for (let offset = 0; offset < data.length; offset += 64) {
    const words = Array.from({ length: 16 }, (_, i) => view.getUint32(offset + i * 4, true));
    let a = a0, b = b0, c = c0, d = d0;
    for (let i = 0; i < 64; i++) {
      let f, g;
      if (i < 16) { f = (b & c) | ((~b) & d); g = i; }
      else if (i < 32) { f = (d & b) | ((~d) & c); g = (5 * i + 1) % 16; }
      else if (i < 48) { f = b ^ c ^ d; g = (3 * i + 5) % 16; }
      else { f = c ^ (b | (~d)); g = (7 * i) % 16; }
      const next = (a + f + constants[i] + words[g]) >>> 0;
      const rotated = (leftRotate(next, shifts[(i % 4) + 4 * Math.floor(i / 16)]) + b) >>> 0;
      a = d; d = c; c = b; b = rotated;
    }
    a0 = (a0 + a) >>> 0;
    b0 = (b0 + b) >>> 0;
    c0 = (c0 + c) >>> 0;
    d0 = (d0 + d) >>> 0;
  }
  const output = new DataView(new ArrayBuffer(16));
  output.setUint32(0, a0, true); output.setUint32(4, b0, true);
  output.setUint32(8, c0, true); output.setUint32(12, d0, true);
  return Array.from(new Uint8Array(output.buffer), (byte) => byte.toString(16).padStart(2, "0")).join("");
}

async function passwordToken(password) {
  if (isHex(password, 16)) return password;
  if (isHex(password, 32)) return password.slice(8, 24);
  const digest = await md5Hex(password);
  return digest.slice(8, 24);
}

async function aesEcbZeroPadded(plaintext) {
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode("Fx4k6AWivOsLE4NI"), { name: "AES-CBC" }, false, ["encrypt"]);
  const zeroIv = new Uint8Array(16);
  const output = new Uint8Array(plaintext.length);
  for (let offset = 0; offset < plaintext.length; offset += 16) {
    const block = plaintext.slice(offset, offset + 16);
    // AES-CBC with a zero IV on one isolated block has the same first block
    // as AES-ECB. WebCrypto has AES-CBC but intentionally does not expose ECB.
    const encrypted = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-CBC", iv: zeroIv }, key, block));
    output.set(encrypted.slice(0, 16), offset);
  }
  return output;
}

async function buildOpenPacket(profile) {
  if (!profile.password.trim()) throw new Error("请先输入开门器密码");
  const token = await passwordToken(profile.password);
  const sign = profile.attribute === 1 ? "-" : "+";
  const command = `A:OPEN;P:${sign} ${profile.openTime},${profile.waitTime},${profile.closeTime};`;
  const body = new TextEncoder().encode(`${Math.floor(Date.now() / 1000)}${token}${command}`);
  const padded = new Uint8Array(Math.ceil(body.length / 16) * 16);
  padded.set(body);
  return aesEcbZeroPadded(padded);
}

function printableText(bytes) {
  return new TextDecoder("utf-8", { fatal: false }).decode(bytes)
    .split("").filter((char) => char === "\t" || char === "\n" || char === "\r" || (char >= " " && char <= "~"))
    .join("").trim();
}

function hex(bytes) {
  return Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("").toUpperCase();
}

function parseResponse(dataView) {
  const bytes = new Uint8Array(dataView.buffer, dataView.byteOffset, dataView.byteLength);
  const text = printableText(bytes);
  const hexValue = hex(bytes);
  const upper = text.toUpperCase();
  return {
    bytes,
    text,
    hex: hexValue,
    success: upper.includes("OK") || hexValue.includes("4F4B"),
    summary: text || `HEX ${hexValue}`,
  };
}

function onNotification(event) {
  const response = parseResponse(event.target.value);
  els.diagnostic.textContent = `响应文本: ${response.text || "<空>"}\n响应 HEX: ${response.hex}`;
  if (state !== "unlocking") return;
  if (response.success) {
    setState("success", `开门成功 · ${response.summary}`);
    notify(`开门成功 · ${response.summary}`);
  } else {
    setState("error", `设备返回：${response.summary}`);
    notify(`设备返回：${response.summary}`, true);
  }
}

async function connectSelectedDevice() {
  if (!device) throw new Error("还没有选择设备");
  setState("connecting");
  server = device.gatt.connected ? device.gatt : await device.gatt.connect();
  const service = await server.getPrimaryService(SERVICE_UUID);
  writeCharacteristic = await service.getCharacteristic(WRITE_UUID);
  notifyCharacteristic = await service.getCharacteristic(NOTIFY_UUID);
  notifyCharacteristic.removeEventListener("characteristicvaluechanged", onNotification);
  notifyCharacteristic.addEventListener("characteristicvaluechanged", onNotification);
  await notifyCharacteristic.startNotifications();
  device.addEventListener("gattserverdisconnected", onDisconnected);
  setState("ready", "蓝牙已就绪");
  els.diagnostic.textContent = `设备: ${device.name || "未命名设备"}\n设备 ID: ${device.id}\n服务: ${SERVICE_UUID}\n写入: ${WRITE_UUID}\n通知: ${NOTIFY_UUID}`;
}

function onDisconnected() {
  server = null;
  writeCharacteristic = null;
  notifyCharacteristic = null;
  if (state !== "success") setState("error", "蓝牙连接已断开");
}

async function selectDevice() {
  if (!window.isSecureContext) {
    const message = "当前页面不是安全上下文，请使用 HTTPS 或 localhost 打开。";
    setState("error", message);
    notify(message, true);
    return;
  }
  if (!("bluetooth" in navigator)) {
    const isDesktopLinux = /Linux/i.test(navigator.userAgent) && !/Android/i.test(navigator.userAgent);
    const message = isDesktopLinux
      ? "当前 Linux Chrome 未启用 Web Bluetooth，请打开 chrome://flags/#experimental-web-platform-features，启用后重启浏览器。"
      : "当前浏览器没有 Web Bluetooth 支持，请使用 Android Chrome 或支持该 API 的 Chromium 浏览器。";
    setState("error", message);
    notify(message, true);
    return;
  }
  try {
    // The original service is a Nordic UART-compatible custom GATT service.
    // The chooser is intentionally user-triggered; Web Bluetooth does not
    // expose a webpage-controlled MAC-address scan.
    device = await navigator.bluetooth.requestDevice({
      // The original app recognized some units from scan-response bytes rather
      // than a service UUID. Let Chrome show the chooser and validate the
      // Nordic UART service after the user selects a device.
      acceptAllDevices: true,
      optionalServices: [SERVICE_UUID],
    });
    els.deviceName.textContent = device.name || "未命名设备";
    els.deviceId.textContent = `浏览器设备 ID：${device.id}`;
    await connectSelectedDevice();
  } catch (error) {
    if (error?.name === "NotFoundError") return;
    setState("error", error?.message || "选择设备失败");
    notify(error?.message || "选择设备失败", true);
  }
}

async function reconnect() {
  try {
    await connectSelectedDevice();
  } catch (error) {
    setState("error", error?.message || "重新连接失败");
    notify(error?.message || "重新连接失败", true);
  }
}

async function unlock() {
  try {
    if (!writeCharacteristic || state !== "ready") throw new Error("请先连接设备");
    const packet = await buildOpenPacket(profileFromForm());
    setState("unlocking");
    els.diagnostic.textContent = `发送字节数: ${packet.length}\n写入方式: ${writeCharacteristic.properties.writeWithoutResponse ? "without response" : "with response"}`;
    if (writeCharacteristic.properties.writeWithoutResponse && "writeValueWithoutResponse" in writeCharacteristic) {
      await writeCharacteristic.writeValueWithoutResponse(packet);
    } else {
      await writeCharacteristic.writeValue(packet);
    }
    setTimeout(() => {
      if (state === "unlocking") {
        setState("error", "设备无响应，请稍后重试");
        notify("设备无响应，请稍后重试", true);
      }
    }, 8000);
  } catch (error) {
    setState("error", error?.message || "开门失败");
    notify(error?.message || "开门失败", true);
  }
}

els.selectButton.addEventListener("click", selectDevice);
els.reconnectButton.addEventListener("click", reconnect);
els.unlockButton.addEventListener("click", unlock);
els.password.addEventListener("input", () => {
  if (state === "ready") els.unlockButton.disabled = !els.password.value.trim();
});
window.addEventListener("beforeunload", () => {
  try { if (server) server.disconnect(); } catch (_) { /* no-op */ }
});

updateEnvironment();
setState("idle");

if ("serviceWorker" in navigator && window.isSecureContext) {
  navigator.serviceWorker.register("./sw.js").catch((error) => {
    console.warn("EasyOpen PWA cache unavailable:", error);
  });
}

  </script>
</body>
